# Netlify construiește previzualizările PR-urilor și site-ul de test (petru-test) din main.
# La fiecare publicare, baza de probă se reface (date inventate). Fără DATABASE_URL, refacerea nu face nimic.
[build]
  command = "npm run db:refacere && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[context.production.environment]
  PETRU_MEDIU = "test"

[context.deploy-preview.environment]
  PETRU_MEDIU = "previzualizare"

[context.branch-deploy.environment]
  PETRU_MEDIU = "previzualizare"

# Partea de server a lui Next.js pe Netlify (paginile se generează la cerere).
# Fără ea, Netlify servește directorul .next ca pe un site static și răspunde „Page not found”.
[[plugins]]
  package = "@netlify/plugin-nextjs"
