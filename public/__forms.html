<!doctype html>
<html lang="ro">
<head><meta charset="utf-8"><title>Formulare</title></head>
<body>
<!-- Formularul pe care Netlify îl detectează la publicare. Pagina reală e /ce-lipseste. -->
<form name="ce-lipseste" data-netlify="true" netlify-honeypot="capcana" hidden>
  <input type="hidden" name="form-name" value="ce-lipseste">
  <input name="pagina"><input name="rol"><textarea name="mesaj"></textarea><input name="capcana">
</form>
</body>
</html>
